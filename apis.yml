aid: levit
name: Levit
description: 'Levit Inc. (레브잇) is a software company headquartered in Seoul, South Korea,
  best known for Alwayz (올웨이즈) — a mobile-first team-purchase commerce app launched in July
  2021 that lets shoppers group together with other buyers to unlock prices below normal
  retail. Levit describes itself as building "a service that everybody uses everyday," and
  previously launched Ping in March 2021. The company runs the Alwayz Seller Center for
  merchants selling on the platform and publishes a seller-focused commerce blog. As of this
  profile Levit publishes no public developer API program, no API documentation or reference,
  no developer portal, and no SDKs — the enrichment pipeline probed the company and product
  domains and found no developer surface.'
